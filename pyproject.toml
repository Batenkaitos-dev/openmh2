# Python tooling for OpenMH2's build. This is not an installable package:
# uv uses it to pin the interpreter and every tool, and uv.lock records the
# exact resolved versions with hashes. Install with tools/setup.sh or
# tools/setup.ps1, which run `uv sync --locked`.

[project]
name = "openmh2-tools"
version = "0.0.0"
requires-python = "==3.14.*"
dependencies = [
    # Splitting the game's files into the pieces the build compiles. The [mips]
    # extra is required even for the PS2: splat imports its N64 segment types
    # (and so n64img) unconditionally.
    "splat64[mips]==0.50.0",
    "spimdisasm==1.42.4",
    "rabbitizer==1.16.2",
    # ELF and ISO 9660 reading
    "pyelftools==0.33",
    "pycdlib==1.20.0",
    # Build tools (the PyPI wheels ship pinned native binaries)
    "ninja==1.13.2",
    "cmake==4.4.3",
]

[tool.uv]
package = false
